<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Homepage</h1>

    <!-- Anchor elements -->
    <h3>Opening links</h3>
    <p>
        <a href="https://www.theodinproject.com/about">About The Odin Project</a>
    </p>

    <!-- Opening links in a new tab -->
    <h3>Opening links in a new tab</h3>
    <p>
        <a href="https://www.theodinproject.com/about" target="_blank" rel="noreferrer">About The Odin Project</a>
    </p>

    <!-- Another page on the same site -->
    <h3>Relative links</h3>
    <a href="pages/about.html">About</a>

    <!-- Using an absolute path we can display an image located on The Odin Project site -->
    <h3>Images</h3>
    <img src="https://www.theodinproject.com/mstile-310x310.png" alt="The Odin Project Logo" height="310" width="310">
    
    <!-- To display images on your website that are hosted on your own web server -->
    <img src="./images/dog.jpg" alt="Dog" height="330" width="300">

</body>
</html>
